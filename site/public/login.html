<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Counteroffer</title>
<meta name="theme-color" content="#071022" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/" data-page="home" aria-label="Counteroffer home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b1426"/><path d="M14 44h36" stroke="#f5a623" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M14 22c10 0 12 14 18 14s8-14 18-14" fill="none" stroke="#7fd4ff" stroke-width="5" stroke-linecap="round"/></svg>
      Counteroffer
    </a>
  </div>
</header>

<main class="auth-main" id="main">
  <div class="card auth-card">
    <div class="eyebrow" id="mode-eyebrow">Seller console</div>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="sub">Set up your storefront for AI buyers.</p>

    <p class="notice bad" id="error" role="alert" hidden></p>
    <p class="notice good" id="info" role="status" hidden></p>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="email" required inputmode="email">
      </div>
      <div class="field">
        <div class="row-between">
          <label for="password">Password</label>
          <button type="button" class="linkbtn" id="forgot" style="font-size:13px">Forgot password?</button>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
        <span class="hint" id="pw-hint" hidden>At least 6 characters.</span>
      </div>
      <button class="btn btn-amber btn-block" type="submit" id="submit">Sign in</button>
    </form>

    <div class="or">OR</div>
    <button class="btn btn-block" type="button" id="google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <p class="auth-foot"><span id="toggle-text">New to Counteroffer?</span> <button type="button" class="linkbtn" id="toggle">Create an account</button></p>
  </div>
</main>

<script type="module">
import { auth, go, authMessage, pageUrl } from "./firebase-init.js";
import {
  onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

document.querySelectorAll("[data-page]").forEach(a => a.href = pageUrl(a.dataset.page));

const $ = id => document.getElementById(id);
let mode = new URLSearchParams(location.search).get("mode") === "signup" ? "signup" : "signin";
let busy = false;

function setMode(m) {
  mode = m;
  const up = m === "signup";
  $("title").textContent = up ? "Create your account" : "Sign in";
  $("sub").textContent = up ? "Free to start. Your Snowflake credentials never leave your account." : "Set up your storefront for AI buyers.";
  $("submit").textContent = up ? "Create account" : "Sign in";
  $("toggle-text").textContent = up ? "Already have an account?" : "New to Counteroffer?";
  $("toggle").textContent = up ? "Sign in" : "Create an account";
  $("password").autocomplete = up ? "new-password" : "current-password";
  $("pw-hint").hidden = !up;
  $("forgot").hidden = up;
  clearMsgs();
}
function clearMsgs() { $("error").hidden = true; $("info").hidden = true; $("email").removeAttribute("aria-invalid"); $("password").removeAttribute("aria-invalid"); }
function showError(msg, field) { $("info").hidden = true; $("error").textContent = msg; $("error").hidden = false; if (field) { $(field).setAttribute("aria-invalid", "true"); $(field).focus(); } }
function showInfo(msg) { $("error").hidden = true; $("info").textContent = msg; $("info").hidden = false; }
function setBusy(b) { busy = b; ["submit", "google", "forgot", "toggle"].forEach(id => $(id).disabled = b); }

setMode(mode);
$("toggle").addEventListener("click", () => setMode(mode === "signup" ? "signin" : "signup"));

onAuthStateChanged(auth, user => { if (user) go("app"); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;
  clearMsgs();
  const email = $("email").value.trim(), pw = $("password").value;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError("Enter a valid email address.", "email");
  if (!pw) return showError("Enter your password.", "password");
  if (mode === "signup" && pw.length < 6) return showError("Password must be at least 6 characters.", "password");
  setBusy(true);
  try {
    if (mode === "signup") await createUserWithEmailAndPassword(auth, email, pw);
    else await signInWithEmailAndPassword(auth, email, pw);
    go("app");
  } catch (err) {
    const f = /password|credential/.test(err.code || "") ? "password" : (/email|user-not-found/.test(err.code || "") ? "email" : null);
    showError(authMessage(err), f);
  } finally { setBusy(false); }
});

$("google").addEventListener("click", async () => {
  if (busy) return;
  clearMsgs(); setBusy(true);
  try { await signInWithPopup(auth, new GoogleAuthProvider()); go("app"); }
  catch (err) { showError(authMessage(err)); }
  finally { setBusy(false); }
});

$("forgot").addEventListener("click", async () => {
  if (busy) return;
  clearMsgs();
  const email = $("email").value.trim();
  if (!email) return showError("Enter your email above, then click “Forgot password?” again.", "email");
  setBusy(true);
  try { await sendPasswordResetEmail(auth, email); showInfo("If an account exists for " + email + ", a reset link is on its way. Check your inbox."); }
  catch (err) { showError(authMessage(err), "email"); }
  finally { setBusy(false); }
});
</script>
</body>
</html>
